name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the Version Packages PR
      pull-requests: write # Create the Version Packages PR
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for CHANGELOG generation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # Trusted publishing needs npm CLI 11.5.1+. pnpm publish hands the upload to this npm
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No NPM_TOKEN: without it, changesets/action leaves .npmrc alone and npm
      # authenticates through the trusted publisher configured on npmjs.com
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
