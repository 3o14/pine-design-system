name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 5 --model claude-sonnet-5"
          prompt: |
            Review this pull request against the conventions in CLAUDE.md.
            Focus on correctness bugs, accessibility regressions (components
            wrap @base-ui/react), token/theming consistency, and test coverage.
            Leave inline comments on specific lines where relevant. Be concise —
            flag real issues only, skip nitpicks a linter would already catch.
